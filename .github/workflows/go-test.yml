name: Go Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test concepts module
        run: cd concepts && go vet ./... && go test -race ./...
      - name: Test each project module
        run: |
          for d in projects/*/; do
            if [ -f "$d/go.mod" ]; then
              (cd "$d" && go vet ./... && go test -race ./...)
            fi
          done
